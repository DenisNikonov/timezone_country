name: Update IANA Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: stable

      - run: dart pub get

      - name: Download latest source data
        run: |
          # Get latest IANA tag from GitHub (eggert/tz uses tags, not releases)
          # Tags API is not version-ordered. Authenticated to lift the rate limit.
          LATEST=$(curl -sL -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/eggert/tz/tags?per_page=100" \
            | grep '"name"' | cut -d'"' -f4 \
            | grep -E '^[0-9]{4}[a-z]+$' | sort -r | head -1)
          if [ -z "$LATEST" ]; then
            echo "::error::Failed to determine latest IANA release tag"
            exit 1
          fi
          echo "Latest IANA release: $LATEST"
          echo "IANA_VERSION=$LATEST" >> $GITHUB_ENV

          curl -sfL "https://raw.githubusercontent.com/eggert/tz/${LATEST}/zone1970.tab" -o /tmp/zone1970.tab
          curl -sfL "https://raw.githubusercontent.com/eggert/tz/${LATEST}/zone.tab" -o /tmp/zone.tab
          curl -sfL "https://raw.githubusercontent.com/eggert/tz/${LATEST}/backward" -o /tmp/backward

          curl -sfL "https://salsa.debian.org/iso-codes-team/iso-codes/-/raw/main/data/iso_3166-1.json" -o /tmp/iso_3166-1.json

          # CLDR releases on its own schedule, unrelated to the IANA version.
          curl -sfL "https://raw.githubusercontent.com/unicode-org/cldr/main/common/supplemental/windowsZones.xml" -o /tmp/windowsZones.xml

          # The file carries no version of its own, so record the commit it
          # came from.
          CLDR=$(curl -sL -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/unicode-org/cldr/commits?path=common/supplemental/windowsZones.xml&per_page=1" \
            | grep -m1 '"sha"' | cut -d'"' -f4 | cut -c1-7)
          echo "CLDR_COMMIT=${CLDR:-unknown}" >> $GITHUB_ENV

          for f in /tmp/zone1970.tab /tmp/zone.tab /tmp/backward /tmp/iso_3166-1.json /tmp/windowsZones.xml; do
            if [ ! -s "$f" ]; then
              echo "::error::Downloaded source file $f is empty"
              exit 1
            fi
          done

      - name: Generate data files
        run: |
          dart run tool/generate_data.dart /tmp/zone1970.tab /tmp/zone.tab /tmp/backward /tmp/iso_3166-1.json /tmp/windowsZones.xml --version ${{ env.IANA_VERSION }}
          dart format lib/src/data/

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet lib/src/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data changes detected!"
            git diff --stat lib/src/data/
          fi

      # This PR is auto-merged, so it needs the same gates as CI.
      - name: Analyze
        if: steps.diff.outputs.changed == 'true'
        run: dart analyze --fatal-infos

      - name: Format check
        if: steps.diff.outputs.changed == 'true'
        run: dart format --output=none --set-exit-if-changed .

      - name: Run tests
        if: steps.diff.outputs.changed == 'true'
        run: dart test

      - name: Bump patch version
        if: steps.diff.outputs.changed == 'true'
        id: version
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          sed -i "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped version: $CURRENT → $NEW_VERSION"

      - name: Update CHANGELOG
        if: steps.diff.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          IANA="${{ env.IANA_VERSION }}"

          # Match keys only: `dart format` wraps long values onto more lines.
          TZ_COUNT=$(grep -c "^  '" lib/src/data/timezone_to_country_data.dart || true)
          CC_COUNT=$(grep -c "^  '" lib/src/data/country_to_timezones_data.dart || true)

          ENTRY="## ${VERSION}\n\n- Updated embedded timezone and country data (${DATE}). IANA Time Zone Database ${IANA}, CLDR ${{ env.CLDR_COMMIT }}.\n- ${TZ_COUNT} timezones, ${CC_COUNT} countries.\n"

          echo -e "${ENTRY}" | cat - CHANGELOG.md > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          commit-message: "chore: update IANA data to ${{ env.IANA_VERSION }}"
          title: "Update IANA Time Zone Database to ${{ env.IANA_VERSION }}"
          body: |
            Automated update from the IANA Time Zone Database.

            **Version**: `${{ env.IANA_VERSION }}`
            **Package version**: `${{ steps.version.outputs.version }}`

            Changes detected in `lib/src/data/`. Tests pass.
          branch: auto/iana-update
          labels: automated,data-update

      - name: Merge Pull Request
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: gh pr merge ${{ steps.pr.outputs.pull-request-number }} --auto --merge --delete-branch
