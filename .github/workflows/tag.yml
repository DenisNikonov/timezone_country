name: Tag Release

on:
  # Tagging starts the publish pipeline, so wait for CI rather than reacting
  # to the push: a tag on a commit that fails CI cannot be taken back.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Push tag for current pubspec version
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, nothing to release."
            exit 0
          fi
          git tag "v${VERSION}"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" "v${VERSION}"
          echo "Pushed tag v${VERSION}"
